<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#fab005" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Yellow Smiley Face Circle -->
  <circle cx="256" cy="256" r="185" fill="url(#faceGrad)" filter="url(#shadow)" />

  <!-- Happy Sparkling Eyes -->
  <!-- Left Eye -->
  <ellipse cx="195" cy="220" rx="22" ry="30" fill="#1e293b" />
  <circle cx="204" cy="208" r="9" fill="#ffffff" />
  
  <!-- Right Eye -->
  <ellipse cx="317" cy="220" rx="22" ry="30" fill="#1e293b" />
  <circle cx="326" cy="208" r="9" fill="#ffffff" />

  <!-- Pink Blushing Cheeks -->
  <ellipse cx="160" cy="285" rx="28" ry="16" fill="#f472b6" opacity="0.6" />
  <ellipse cx="352" cy="285" rx="28" ry="16" fill="#f472b6" opacity="0.6" />

  <!-- Cute Graduation Cap Accent on Head -->
  <path d="M 256 70 L 330 100 L 256 130 L 182 100 Z" fill="#1e1b4b" />
  <rect x="220" y="115" width="72" height="20" rx="6" fill="#312e81" />
  <path d="M 320 105 L 340 135 L 335 155" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  <circle cx="335" cy="158" r="5" fill="#f59e0b" />

  <!-- Big Happy Smile Mouth -->
  <path d="M 180 270 Q 256 375 332 270" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round" />
  <path d="M 180 270 Q 256 375 332 270 Z" fill="#ffffff" opacity="0.2" />
</svg>
